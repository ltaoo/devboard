<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/dist/" />
    <title>Devboard</title>
    <style>
      :root {
        --background: #ededed;
        --foreground: #171717;
        --weui-BG-0: #fff;
        --weui-BG-1: #f7f7f7;
        --weui-BG-2: #fff;
        --weui-BG-3: #f7f7f7;
        --weui-BG-4: #4c4c4c;
        --weui-BG-5: #fff;
        --weui-FG-0: rgb(0 0 0 / 90%);
        --weui-FG-1: rgb(0 0 0 / 55%);
        --weui-FG-2: rgb(0 0 0 / 30%);
        --weui-FG-3: rgb(0 0 0 / 10%);
        --weui-FG-4: rgb(0 0 0 / 15%);
        --weui-FG-5: rgb(0 0 0 / 5%);
        --weui-BG-COLOR-ACTIVE: #ececec;
        --weui-RED: #fa5151;
        --weui-GREEN: #07c160;
        --weui-BRAND: #07c160;
        --hh: 100vh;
      }
      [data-theme="dark"] {
        --background: #111;
        --foreground: #f3f4f6;
        --weui-BG-0: #111;
        --weui-BG-1: #1e1e1e;
        --weui-BG-2: #191919;
        --weui-BG-3: #202020;
        --weui-BG-4: #404040;
        --weui-BG-5: #2c2c2c;
        --weui-FG-0: rgb(255 255 255 / 80%);
        --weui-FG-1: rgb(255 255 255 / 50%);
        --weui-FG-2: rgb(255 255 255 / 30%);
        --weui-FG-3: rgb(255 255 255 / 10%);
        --weui-FG-4: rgb(255 255 255 / 15%);
        --weui-FG-5: #292929;
        --weui-BG-COLOR-ACTIVE: #373737;
      }
      html, body { overscroll-behavior: none; margin: 0; }
      body { width: 100vw; height: 100vh; font-family: system-ui, -apple-system, "Helvetica Neue"; }
      [data-theme="light"] body { background-color: #ededed; }
      [data-theme="dark"] body { background-color: #111; }
      img { -webkit-user-drag: none; }
      video { max-height: 100%; height: unset; }
    </style>
    <script src="timeless/0.33.0/timeless.umd.min.js"></script>
    <script src="timeless/0.33.0/timeless.dom.umd.min.js"></script>
    <script src="timeless/0.33.0/timeless.web.umd.min.js"></script>
  </head>
  <body>
    <script>
      !function () { try { var d = document.documentElement, n = "data-theme"; var e = localStorage.getItem("theme"); if (e === "system" || !e) { var q = "(prefers-color-scheme: dark)", m = window.matchMedia(q); e = m.media !== q || m.matches ? "dark" : "light"; } d.style.colorScheme = e; d.setAttribute(n, e); } catch (_) {} }();
    </script>
    <div id="app" data-n="application-root"></div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
