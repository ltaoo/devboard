<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Devboard logo</title>
  <desc id="desc">Two softly colored stacked clipboard cards representing clipboard history.</desc>
  <defs>
    <linearGradient id="tile-gradient" x1="16" y1="12" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#918AF7"/>
      <stop offset="1" stop-color="#6675E8"/>
    </linearGradient>
  </defs>
  <rect id="app-tile" x="4" y="4" width="120" height="120" rx="30" fill="url(#tile-gradient)"/>
  <rect id="clipboard-history" x="44" y="25" width="61" height="80" rx="16" fill="#FFAA7D"/>
  <rect id="clipboard-card" x="23" y="32" width="70" height="78" rx="18" fill="#FCFDFF"/>
  <rect id="clipboard-clip" x="42" y="24" width="32" height="19" rx="9.5" fill="#525CC8"/>
  <g id="clipboard-items" fill="none" stroke-linecap="round">
    <circle cx="41" cy="61" r="4.5" fill="#7078E4"/>
    <path d="M54 61h23" stroke="#B3B9E8" stroke-width="6"/>
    <circle cx="41" cy="78" r="4.5" fill="#FF956D"/>
    <path d="M54 78h18" stroke="#B3B9E8" stroke-width="6"/>
    <circle cx="41" cy="95" r="4.5" fill="#7078E4"/>
    <path d="M54 95h23" stroke="#B3B9E8" stroke-width="6"/>
  </g>
</svg>
